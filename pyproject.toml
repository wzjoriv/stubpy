[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stubpy"
dynamic = ["version"]
description = "Generate .pyi stub files with full **kwargs / *args MRO backtracing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Josue N Rivera", email = "josue.n.rivera@outlook.com" },
]
keywords = [
    "stubs", "type hints", "pyi", "static analysis", "mypy", "stubgen",
    "pyright", "typing", "code generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Implementation :: GraalPy",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage      = "https://github.com/wzjoriv/stubpy"
Repository    = "https://github.com/wzjoriv/stubpy"
Documentation = "https://wzjoriv.github.io/stubpy"
"Bug Tracker" = "https://github.com/wzjoriv/stubpy/issues"

[project.optional-dependencies]
dev = [
    "stubpy[docs]",
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.6",
    "typer>=0.12",
    "tomli; python_version < '3.11'",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinxcontrib-mermaid>=0.9",
    "sphinx-autobuild",
]

[project.scripts]
stubpy = "stubpy.cli:main"

[tool.setuptools.dynamic]
version = {attr = "stubpy.__version__"}

[tool.setuptools.packages.find]
where   = ["."]
include = ["stubpy*"]

[tool.setuptools.package-data]
stubpy = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["stubpy"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
include = ["stubpy/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
extend-exclude = ["build", "*.egg-info", "scripts/devkit", ".venvs"]

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle + pyflakes
    "I",              # import ordering
    "UP",             # modern syntax
    "B",              # flake8-bugbear: likely bugs
    "C4",             # unnecessary comprehension / call forms
]
ignore = [
    "E501",           # line length: long docstring and table lines are fine
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["B008"]
"tests/**/*.py" = ["UP006", "UP007", "UP035", "UP037", "UP045", "E701", "E702", "E741"]
"tests/conftest.py" = ["E402"]

# ---------------------------------------------------------------------------
# Developer tools: python scripts/dev.py --help
# ---------------------------------------------------------------------------
[tool.devkit]
tools = ["stubpy_tools:app", "corpora_tools:app"]   # python scripts/dev.py stubpy | corpora ...

[tool.devkit.check]            # dev.py check: ruff, pytest, docs with warnings as errors
lint = ["stubpy", "scripts", "tests"]
tests = ["-q", "-p", "no:cacheprovider"]
docs = "docs"

[tool.devkit.docs]             # dev.py docs [--open] [--clean]
source = "docs"
out = "docs/_build/html"

[tool.devkit.version]          # dev.py version show | bump patch | set X.Y.Z
file = "stubpy/__init__.py"
tag = "{version}"
also = [{file = "README.md", pattern = "rev: {version}"}, {file = "docs/guides/ci.rst", pattern = "rev: {version}"}]

[tool.devkit.stub]             # dev.py stub generate | check (stubpy on itself)
targets = ["stubpy"]
output = "build/stubs"

[tool.devkit.tiers]            # dev.py test [tier]
default = "quick"
log_dir = "build/test-logs"

[tool.devkit.tiers.quick]
help = "The whole suite, quiet (about 10 s)."
args = ["tests", "-q", "-p", "no:cacheprovider"]

[tool.devkit.tiers.cov]
help = "The whole suite with a coverage report."
args = ["tests", "-q", "--cov=stubpy", "--cov-report=term-missing"]
