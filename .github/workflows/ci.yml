name: Tests

# quick: every pull request / push (lint + the suite on one Python).
# full: every supported Python (CPython 3.10-3.15, free-threaded 3.14t and 3.15t, PyPy, GraalPy) on Linux, plus the oldest and newest on Windows / macOS,
# coverage and Pyodide; runs on pushes to main, when a maintainer adds the `full-tests` label to a pull request,
# or when the workflow is started by hand.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pytest>=7.0" "ruff>=0.6"
      - name: Lint
        run: ruff check --output-format github
      - name: Quick tests
        run: pytest -q -p no:cacheprovider --durations=15
      - name: Doctests
        run: pytest -q -p no:cacheprovider -o addopts="" --doctest-modules stubpy

  full:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-tests'))
    name: full (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t", "pypy3.11", "graalpy-25.0"]
        include:
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.15" }
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.15" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e . "pytest>=7.0"
      - name: Full tests
        run: pytest -q -p no:cacheprovider

  coverage:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e . "pytest>=7.0" pytest-cov
      - name: Tests with coverage
        run: pytest -q -p no:cacheprovider --cov=stubpy --cov-report=term-missing

  pyodide:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-tests'))
    name: Pyodide (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Pyodide tooling
        run: |
          pip install pyodide-build build
          pyodide xbuildenv install
      - name: Build wheel
        run: python -m build --wheel --outdir dist
      - name: Tests in Pyodide
        run: |
          pyodide venv .venv-pyodide
          source .venv-pyodide/bin/activate
          pip install pytest dist/*.whl
          python -m pytest -q -p no:cacheprovider
