name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6"
      - run: ruff check --output-format github

  test:
    name: ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11"]
        include:
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.15" }
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.15" }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . "pytest>=7.0"
      - run: pytest -q -p no:cacheprovider

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . "pytest>=7.0" pytest-cov
      - run: pytest -q -p no:cacheprovider --cov=stubpy --cov-report=term-missing

  pyodide:
    name: Pyodide (WebAssembly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install pyodide-build build
      - run: pyodide xbuildenv install
      - run: python -m build --wheel --outdir dist
      - run: pyodide venv .venv-pyodide
      - name: Test in Pyodide
        run: |
          source .venv-pyodide/bin/activate
          pip install pytest dist/*.whl
          python -m pytest -q -p no:cacheprovider
