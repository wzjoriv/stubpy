[build-system]
requires = ["setuptools>=68", "numpy", "Cython>=3.0", "pybind11>=2.11", "nanobind>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svgraster"
version = "0.3.0"
description = "Compiled raster primitives in every common binding style; a stubpy test corpus."
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
jit = ["numba>=0.59"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["svgraster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
