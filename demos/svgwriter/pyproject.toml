[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svgwriter"
version = "1.1.0"
description = "Write, parse, compose and animate SVG 1.1 documents with an element-per-class object model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Josue N Rivera" }]
dependencies = []
keywords = ["svg", "vector", "graphics", "drawing", "animation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Typing :: Typed",
]

[project.optional-dependencies]
ops = ["skia-python>=87"]
test = ["pytest>=7"]

[project.scripts]
svgwriter = "svgwriter.__main__:main"

[tool.setuptools.packages.find]
include = ["svgwriter*"]

[tool.setuptools.package-data]
svgwriter = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
